networks:
  rede-votacao:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  dados-validator-1:
  dados-validator-2:
  dados-validator-3:
  dados-validator-4:
  dados-rpc:

services:

  bootnode:
    image: quorumengineering/quorum:23.4.0
    container_name: tcc-bootnode
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.10
    volumes:
      - ./bootnode:/data
    entrypoint:
      - bootnode
      - --nodekey=/data/nodekey
      - --addr=0.0.0.0:30301
      - --verbosity=3
    restart: unless-stopped

  validator-1:
    image: quorumengineering/quorum:23.4.0
    container_name: tcc-validator-1
    depends_on:
      - bootnode
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.11
    volumes:
      - dados-validator-1:/data
      - ./validators/1:/keys
      - ./config:/config
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -d /data/geth ]; then
          cp /config/static-nodes.json /data/static-nodes.json
          cp /keys/nodekey /data/nodekey
          mkdir -p /data/keystore
          cp /keys/keystore/* /data/keystore/
          geth --datadir /data init /config/genesis.json
        fi
        exec geth \
          --datadir /data \
          --networkid 1337 \
          --nodiscover \
          --port 30303 \
          --http --http.addr 0.0.0.0 --http.port 8545 \
          --http.api eth,net,web3,istanbul,txpool \
          --http.corsdomain "*" \
          --mine --miner.threads 1 \
          --miner.etherbase 0xcb428208FB91bE659B983F5f952a9a6BF144B816 \
          --syncmode full \
          --verbosity 3 \
          --unlock 0xcb428208FB91bE659B983F5f952a9a6BF144B816 \
          --password /dev/null \
          --allow-insecure-unlock
    restart: unless-stopped

  validator-2:
    image: quorumengineering/quorum:23.4.0
    container_name: tcc-validator-2
    depends_on:
      - bootnode
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.12
    volumes:
      - dados-validator-2:/data
      - ./validators/2:/keys
      - ./config:/config
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -d /data/geth ]; then
          cp /config/static-nodes.json /data/static-nodes.json
          cp /keys/nodekey /data/nodekey
          mkdir -p /data/keystore
          cp /keys/keystore/* /data/keystore/
          geth --datadir /data init /config/genesis.json
        fi
        exec geth \
          --datadir /data \
          --networkid 1337 \
          --nodiscover \
          --port 30303 \
          --http --http.addr 0.0.0.0 --http.port 8545 \
          --http.api eth,net,web3,istanbul,txpool \
          --http.corsdomain "*" \
          --mine --miner.threads 1 \
          --miner.etherbase 0x518Bb70c859d9379180AA17A09678a85e5a1bc81 \
          --syncmode full \
          --verbosity 3 \
          --unlock 0x518Bb70c859d9379180AA17A09678a85e5a1bc81 \
          --password /dev/null \
          --allow-insecure-unlock
    restart: unless-stopped

  validator-3:
    image: quorumengineering/quorum:23.4.0
    container_name: tcc-validator-3
    depends_on:
      - bootnode
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.13
    volumes:
      - dados-validator-3:/data
      - ./validators/3:/keys
      - ./config:/config
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -d /data/geth ]; then
          cp /config/static-nodes.json /data/static-nodes.json
          cp /keys/nodekey /data/nodekey
          mkdir -p /data/keystore
          cp /keys/keystore/* /data/keystore/
          geth --datadir /data init /config/genesis.json
        fi
        exec geth \
          --datadir /data \
          --networkid 1337 \
          --nodiscover \
          --port 30303 \
          --http --http.addr 0.0.0.0 --http.port 8545 \
          --http.api eth,net,web3,istanbul,txpool \
          --http.corsdomain "*" \
          --mine --miner.threads 1 \
          --miner.etherbase 0x1a7754c13ACE1e58D4E4e20d86F19C423E94B5e9 \
          --syncmode full \
          --verbosity 3 \
          --unlock 0x1a7754c13ACE1e58D4E4e20d86F19C423E94B5e9 \
          --password /dev/null \
          --allow-insecure-unlock
    restart: unless-stopped

  validator-4:
    image: quorumengineering/quorum:23.4.0
    container_name: tcc-validator-4
    depends_on:
      - bootnode
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.14
    volumes:
      - dados-validator-4:/data
      - ./validators/4:/keys
      - ./config:/config
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -d /data/geth ]; then
          cp /config/static-nodes.json /data/static-nodes.json
          cp /keys/nodekey /data/nodekey
          mkdir -p /data/keystore
          cp /keys/keystore/* /data/keystore/
          geth --datadir /data init /config/genesis.json
        fi
        exec geth \
          --datadir /data \
          --networkid 1337 \
          --nodiscover \
          --port 30303 \
          --http --http.addr 0.0.0.0 --http.port 8545 \
          --http.api eth,net,web3,istanbul,txpool \
          --http.corsdomain "*" \
          --mine --miner.threads 1 \
          --miner.etherbase 0x77733489c347c941cB697F134C9BD89e42c641Ff \
          --syncmode full \
          --verbosity 3 \
          --unlock 0x77733489c347c941cB697F134C9BD89e42c641Ff \
          --password /dev/null \
          --allow-insecure-unlock
    restart: unless-stopped

  rpc-node:
    image: quorumengineering/quorum:23.4.0
    container_name: tcc-rpc-node
    depends_on:
      - validator-1
      - validator-2
      - validator-3
      - validator-4
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.20
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - dados-rpc:/data
      - ./rpc-node:/keys
      - ./config:/config
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -d /data/geth ]; then
          cp /config/static-nodes.json /data/static-nodes.json
          cp /keys/nodekey /data/nodekey
          geth --datadir /data init /config/genesis.json
        fi
        exec geth \
          --datadir /data \
          --networkid 1337 \
          --nodiscover \
          --port 30303 \
          --http --http.addr 0.0.0.0 --http.port 8545 \
          --http.api eth,net,web3,istanbul,txpool,personal,admin \
          --http.corsdomain "*" \
          --http.vhosts "*" \
          --ws --ws.addr 0.0.0.0 --ws.port 8546 \
          --ws.api eth,net,web3 \
          --ws.origins "*" \
          --syncmode full \
          --verbosity 3
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc-backend
    depends_on:
      - rpc-node
    networks:
      rede-votacao:
        ipv4_address: 172.20.0.30
    ports:
      - "3000:3000"
    env_file:
      - .env  
    environment:
      - PORT=3000
      - RPC_URL=http://rpc-node:8545
      - CHAIN_ID=1337
      - NODE_ENV=development
    restart: unless-stopped

